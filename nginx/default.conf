# 1. Upstream pools with connection reuse
upstream backend_api {
    server server:5000;
    keepalive 32;
}

upstream frontend_client {
    server client:80;
    keepalive 32;
}

# 2. Server Block
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    # API Proxy (Node / Express) with regex to handle both /api and /api/ paths, as well as any subpaths
    location ~ ^/api(/|$) {
        proxy_pass http://backend_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Proxy (Client container serving React build)
    location / {
        proxy_pass http://frontend_client;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check
    location /healthz {
        return 200 "healthy\n";
    }
}