upstream backend_api {
    server server:5000;
    keepalive 32;
}

upstream frontend_client {
    server client:80;
    keepalive 32;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name plottrade.aavys.app www.plottrade.aavys.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://plottrade.aavys.app$request_uri;
    }
}


# www → canonical domain
server {
    listen 443 ssl;
    server_name www.plottrade.aavys.app;

    ssl_certificate /etc/letsencrypt/live/plottrade.aavys.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plottrade.aavys.app/privkey.pem;

    return 301 https://plottrade.aavys.app$request_uri;
}


# Main application
server {
    listen 443 ssl;
    server_name plottrade.aavys.app;

    ssl_certificate /etc/letsencrypt/live/plottrade.aavys.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plottrade.aavys.app/privkey.pem;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    location ~ ^/api(/|$) {
        proxy_pass http://backend_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_client;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        return 200 "healthy\n";
    }
}