server {
    listen 80;
    server_name localhost;

    # Set document root once for all locations below
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing fallback (prevents 404s on refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed static assets (JS, CSS, images, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}