version: '3.8'

services:
  server:
    image: zaydecode/server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - AWS_SECRET_ID=prod/plottrade/mern
      - AWS_REGION=us-east-1
    ports:
      - "5000:5000" # Exposed directly so the AWS ALB Target Group can hit it
    restart: unless-stopped